name: Bug
description: Something else is wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      render: shell
  - type: input
    id: version
    attributes:
      label: frostphp and PHP versions
