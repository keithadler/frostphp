name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Tests
        run: vendor/bin/phpunit

      - name: frostphp on itself
        run: php bin/frostphp src bin scripts

      - name: Capability docs are current
        run: php scripts/gen_docs.php --check

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Cache the pinned corpus
        uses: actions/cache@v6
        with:
          path: corpus/.cache
          key: corpus-${{ hashFiles('corpus/manifest.json') }}

      - name: The false-positive guard
        run: php scripts/corpus.php
